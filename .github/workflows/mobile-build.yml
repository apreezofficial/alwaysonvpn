name: AlwaysOnVPN Mobile - Build

on:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    name: TypeScript Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Expo dependency check
        run: npx expo install --check

      - name: TypeScript strict check
        run: npm run ts:check

  build-android:
    name: Build Android APK
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Assemble release APK
        working-directory: mobile/android
        run: >
          ./gradlew assembleRelease -x lint -x test --no-daemon
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk alwaysonvpn.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alwaysonvpn-android-${{ github.sha }}
          path: mobile/alwaysonvpn.apk
          if-no-files-found: error
          retention-days: 30

      # Every successful build on main refreshes a "latest-apk" pre-release,
      # giving a stable download link:
      # https://github.com/<owner>/<repo>/releases/download/latest-apk/alwaysonvpn.apk
      - name: Publish latest APK
        if: github.event_name != 'release' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest Android build
          body: Automated build from ${{ github.sha }}.
          prerelease: true
          make_latest: false
          files: mobile/alwaysonvpn.apk

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/alwaysonvpn.apk
